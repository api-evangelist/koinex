name: Koinex
description: 'Koinex was an Indian digital-asset exchange launched in 2017, describing itself as India''s
  first and largest cryptocurrency exchange with more than one million users. It offered spot trading
  across multiple crypto assets with INR pairs before regulatory uncertainty around Indian banking access
  forced it to shut down all services in June 2019, asking users to withdraw their holdings by July 15,
  2019. The company is DEFUNCT: koinex.in now serves only a single static wind-down notice directing
  former users to claim any crypto assets left on the platform through CoinDCX, with which Koinex
  partnered for the transition. There is no live product, developer portal, documentation, or API
  surface; the domain''s TLS certificate expired in March 2025 and every path other than the notice
  returns 403. Retained in the API Evangelist network as a historical record of a shut-down crypto
  exchange and as a Pantera Capital portfolio lead.'
